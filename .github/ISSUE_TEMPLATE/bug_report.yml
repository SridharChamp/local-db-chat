name: Bug report
description: Something went wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Please report it privately instead (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The question you asked, what you expected, and what you got. Remove any private data.
    validations:
      required: true
  - type: textarea
    id: sql
    attributes:
      label: Generated SQL and error (if any)
      render: sql
  - type: input
    id: database
    attributes:
      label: Database and version
      placeholder: PostgreSQL 16, MySQL 8.4, SQL Server 2022, SQLite...
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: qwen2.5-coder:7b
  - type: input
    id: env
    attributes:
      label: OS, Python version, local-db-chat version
      placeholder: Windows 11, Python 3.12, 0.1.0
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ldbc doctor`
      render: text
