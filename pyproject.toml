[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "local-db-chat"
version = "0.1.0"
description = "Talk to your database in plain English with a local LLM. Nothing leaves your machine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["llm", "text-to-sql", "ollama", "local", "privacy", "database", "support"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sqlalchemy>=2.0",
    "sqlglot>=25.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5.0"]
all = ["psycopg[binary]>=3.1", "pymysql>=1.1", "pyodbc>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
ldbc = "localdbchat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localdbchat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
